# Terminal configuration - see: https://github.com/tmux/tmux/wiki/FAQ
set -ga terminal-overrides ',*:Tc' # this is for 256 color
set -g mouse on

# Toggle mouse (set mouse off to allow mouse in Neovim)
# https://wiki.archlinux.org/title/tmux#Other_Settings
# https://unix.stackexchange.com/questions/478922/tmux-select-and-copy-pane-text-with-mouse#comment1276743_480200
bind-key -T prefix m set -g mouse\; display 'Mouse: #{?mouse,ON,OFF}'
set -g history-file ~/.tmux_history

# Enables ANSI pass through
# https://github.com/tinted-theming/tinted-shell/blob/main/USAGE.md#tmux
set -g allow-passthrough on

# Copy mode vi key bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tmux-tilit is disabled: on macOS its script runs with /bin/bash 3.2, where `declare -A` fails, so
# @tilit-prefix is ignored and Alt bindings (M-b, M-f, M-[ ...) are added to the root table. They break
# Alt+arrow word movement and mangle terminal query replies (garbage text in other panes when opening opencode).
# Broke after the tilit update that added `declare -A` (commit 386683d, 2026-08-20,
# "perf: batch @tilit- option lookups").
# Its useful parts (Shift+Left/Right window switching and auto layout) are replicated below, see "Replacement for tilit".
# set -g @plugin '2kabhishek/tmux-tilit'

set -g @plugin 'tinted-theming/tinted-tmux'

set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'

# Replacement for tilit (disabled, see the comment at the plugin list): Shift + Left/Right switches windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Replacement for tilit: keep panes evenly spread after splitting or closing a pane
set-hook -g after-split-window "select-layout -E"
set-hook -g pane-exited "select-layout -E"

# Replacement for tilit: open new panes and windows in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Repeat time lets you run more actions with a single prefix.
set -g repeat-time 1000

run-shell "tmux set-option -g @tinted-color $(tinty current)"

# Initialize TPM (keep at bottom) - macOS only for now
if-shell -b '[ "$( $HOME/scripts/get_operating_system.sh )" = "macos" ]' \
    'run "$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm"'
